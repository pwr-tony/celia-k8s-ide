# Celia Server Configuration

server:
  host: "127.0.0.1"
  port: 9119
  read_timeout: 30s
  write_timeout: 30s
  shutdown_timeout: 10s

websocket:
  read_buffer_size: 1024
  write_buffer_size: 1024
  ping_interval: 30s
  pong_timeout: 60s

kubernetes:
  # Path to kubeconfig file (empty uses default)
  kubeconfig: ""
  # Default namespace when none specified
  default_namespace: "default"
  # Watch resync period
  resync_period: 30s
  # Request timeout
  request_timeout: 30s

logging:
  level: "info"
  format: "json"
  output: "stdout"

audit:
  enabled: true
  # Directory for audit logs
  directory: "~/.celia/audit"
  # Retention period for audit logs
  retention: "30d"

trouble:
  # Enable automatic problem detection
  enabled: true
  # Detection interval
  detection_interval: 10s
  # Enabled detectors
  detectors:
    - crashloop
    - imagepull
    - oomkilled
    - pending
    - probe_failing
    - node_notready
    - node_pressure
    - high_restart
